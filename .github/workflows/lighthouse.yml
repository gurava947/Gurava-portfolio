name: Verify and Lighthouse budget

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the catalogue
        run: npm run catalog:build

      - name: Audit the catalogue against its source seeds
        run: node scripts/audit-catalog.mjs

      - name: Unit and API tests
        run: npm test

      - name: Python exercise tests
        run: npm run test:python

  lighthouse:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build production bundle
        # build:vercel is what vercel.json runs. The plain build keeps the local-API settings sync
        # in the bundle, which Lighthouse would then measure as requests that production never makes.
        run: npm run build:vercel

      - name: Run Lighthouse budget
        run: npx --yes @lhci/cli@0.15.1 autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
          LHCI_BUILD_CONTEXT__COMMIT_SHA: ${{ github.sha }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 14
